server:
  port: ${PORT:8080}

spring:
  # ==================== DataSource ====================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civicpulse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ==================== JPA / Hibernate ====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    # ==================== Multipart File Upload ====================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ==================== Mail Configuration (Gmail SMTP) ====================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ==================== JWT Configuration ====================
# JWT_SECRET is required: there is no fallback value. A committed default
# would let anyone forge tokens, so the app refuses to start without it.
# Generate one with: openssl rand -base64 32
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# ==================== Cloudinary Configuration ====================
# Configuration is now read directly via @Value in CloudinaryConfig.java

logging:
  level:
    root: INFO

# ==================== Application URLs ====================
civicpulse:
  frontend:
    url: ${FRONTEND_URL:https://civicpulse-frontend-3mb8.onrender.com}