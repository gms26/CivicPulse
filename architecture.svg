<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .text-title { font-family: system-ui, sans-serif; font-weight: bold; font-size: 16px; fill: #0f172a; }
      .text-sub { font-family: system-ui, sans-serif; font-size: 12px; fill: #475569; }
      .line { stroke: #cbd5e1; stroke-width: 2; fill: none; }
      .line-anim { stroke: #3b82f6; stroke-width: 3; fill: none; stroke-dasharray: 8; animation: flow 1s linear infinite; }
      @keyframes flow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
      .arrow { fill: #3b82f6; }
      .bg { fill: #f8fafc; rx: 12px; }
      
      .box-frontend { fill: #eff6ff; stroke: #3b82f6; }
      .box-backend { fill: #f0fdf4; stroke: #22c55e; }
      .box-db { fill: #fef2f2; stroke: #ef4444; }
      .box-smtp { fill: #fffbeb; stroke: #f59e0b; }
      .box-cloud { fill: #f5f3ff; stroke: #8b5cf6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Frontend -->
  <g transform="translate(250, 50)">
    <rect width="300" height="100" class="box box-frontend" />
    <text x="150" y="35" text-anchor="middle" class="text-title">Frontend (React)</text>
    <text x="150" y="60" text-anchor="middle" class="text-sub">React 18, Vite 5, Tailwind CSS</text>
    <text x="150" y="80" text-anchor="middle" class="text-sub">Deployed on Render (Static Site)</text>
  </g>

  <!-- Backend -->
  <g transform="translate(250, 250)">
    <rect width="300" height="120" class="box box-backend" />
    <text x="150" y="35" text-anchor="middle" class="text-title">Backend (Spring Boot)</text>
    <text x="150" y="60" text-anchor="middle" class="text-sub">Java 25, Spring Security, JWT</text>
    <text x="150" y="80" text-anchor="middle" class="text-sub">WebSockets, Spring Mail</text>
    <text x="150" y="100" text-anchor="middle" class="text-sub">Deployed on Render (Docker Container)</text>
  </g>

  <!-- Database -->
  <g transform="translate(50, 450)">
    <rect width="200" height="100" class="box box-db" />
    <text x="100" y="40" text-anchor="middle" class="text-title">PostgreSQL</text>
    <text x="100" y="65" text-anchor="middle" class="text-sub">Supabase</text>
    <text x="100" y="85" text-anchor="middle" class="text-sub">Relational Data</text>
  </g>

  <!-- Gmail SMTP -->
  <g transform="translate(300, 450)">
    <rect width="200" height="100" class="box box-smtp" />
    <text x="100" y="40" text-anchor="middle" class="text-title">Gmail SMTP</text>
    <text x="100" y="65" text-anchor="middle" class="text-sub">Email Notifications</text>
  </g>

  <!-- Cloudinary -->
  <g transform="translate(550, 450)">
    <rect width="200" height="100" class="box box-cloud" />
    <text x="100" y="40" text-anchor="middle" class="text-title">Cloudinary CDN</text>
    <text x="100" y="65" text-anchor="middle" class="text-sub">Image Storage</text>
  </g>

  <!-- Connections -->
  
  <!-- Frontend to Backend -->
  <!-- Request / REST -->
  <path d="M 330 150 L 330 250" class="line" />
  <path d="M 330 150 L 330 250" class="line-anim" marker-end="url(#arrowhead)" />
  <text x="310" y="205" text-anchor="end" class="text-sub">REST API (Axios)</text>

  <!-- WebSocket -->
  <path d="M 470 150 L 470 250" class="line" />
  <path d="M 470 150 L 470 250" class="line-anim" marker-end="url(#arrowhead)" />
  <text x="490" y="205" text-anchor="start" class="text-sub">WebSocket (STOMP/SockJS)</text>

  <!-- Backend to DB -->
  <path d="M 310 370 L 150 450" class="line" />
  <path d="M 310 370 L 150 450" class="line-anim" marker-end="url(#arrowhead)" />
  <text x="200" y="390" text-anchor="end" class="text-sub">JPA / Hibernate</text>

  <!-- Backend to SMTP -->
  <path d="M 400 370 L 400 450" class="line" />
  <path d="M 400 370 L 400 450" class="line-anim" marker-end="url(#arrowhead)" />
  <text x="415" y="415" text-anchor="start" class="text-sub">SMTP</text>

  <!-- Backend to Cloudinary -->
  <path d="M 490 370 L 650 450" class="line" />
  <path d="M 490 370 L 650 450" class="line-anim" marker-end="url(#arrowhead)" />
  <text x="600" y="390" text-anchor="start" class="text-sub">HTTP SDK</text>

</svg>
